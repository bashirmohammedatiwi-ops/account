# البوابة على 5005. واجهة مسح الباركود تستخدم /price-api (عملية منفصلة، غالباً على 5000).
# تحديث portal وحده لا يصلح أسماء الأسعار. لتحديث خدمة الأسعار:
#   git pull && docker compose --profile price-api up -d --build price-api
# أوقف العملية القديمة على 5000 أولاً، واربط قاعدة البيانات الحالية إن وُجدت.
services:
  portal:
    build: .
    container_name: edari-delegate-portal
    ports:
      - "5005:5005"
    environment:
      PORT: 5005
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/portal.db
      UPLOAD_DIR: /app/uploads
      PUBLIC_URL: ${PUBLIC_URL:-http://187.124.23.65:5005}
      SYNC_API_KEY: ${SYNC_API_KEY:-edari-sync-local-key-2025}
      SHORJA_HUB_URL: ${SHORJA_HUB_URL:-http://187.124.23.65:5007}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-admin123}
      EMP_USER: ${EMP_USER:-صلاح}
      EMP_PASS: ${EMP_PASS:-5910}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
    volumes:
      # لا تستخدم docker compose down -v — يحذف القالب والشعار
      - portal_data:/app/data
      - portal_uploads:/app/uploads
    restart: unless-stopped

  price-api:
    profiles: ["price-api"]
    build: .
    container_name: edari-price-api
    command: ["node", "price-app-server.js"]
    ports:
      - "5000:5000"
    environment:
      PRICE_APP_PORT: 5000
      PRICE_APP_HOST: 0.0.0.0
      DATABASE_PATH: /app/data/portal.db
      PRICE_SYNC_KEY: ${PRICE_SYNC_KEY:-edari-sync-local-key-2025}
      SYNC_API_KEY: ${SYNC_API_KEY:-edari-sync-local-key-2025}
    volumes:
      - price_data:/app/data
    restart: unless-stopped

volumes:
  portal_data:
  portal_uploads:
  price_data:
