name: edari_delegate
description: Edari Delegate — تطبيق المندوب للآيباد والهاتف
publish_to: 'none'
version: 1.2.31+37

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  open_filex: ^4.6.0
  print_bluetooth_thermal: ^1.2.1
  flutter_blue_plus: ^2.3.12
  permission_handler: ^12.0.1
  connectivity_plus: ^6.1.4
  sqflite: ^2.4.2
  path: ^1.9.1
  uuid: ^4.5.3
  esc_pos_utils_plus: ^2.0.4
  image: ^4.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/app_icon.png
    background_color: "#FFFFFF"
    theme_color: "#0055D4"
  windows:
    generate: true
    image_path: assets/app_icon.png
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
